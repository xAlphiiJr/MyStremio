name: Continuous integration

on: [pull_request, push]

defaults:
  run:
    working-directory: stremio-shell/stremio-shell-ng-main
    shell: pwsh

jobs:
  test:
    runs-on: windows-latest
    env:
      MYSTREMIO_SKIP_LIBMPV: "1"
    steps:
    - name: disable git eol translation
      working-directory: ${{ github.workspace }}
      run: git config --global core.autocrlf false
    - name: checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - name: Stable with rustfmt and clippy
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: stable
        target: x86_64-pc-windows-msvc
        components: rustfmt, clippy
    - name: Lint code format
      run: cargo fmt --all -- --check
    - name: Lint code
      run: cargo clippy --all --target x86_64-pc-windows-msvc -- -D warnings
    - name: Test
      run: cargo test --target x86_64-pc-windows-msvc
    - name: Smoke assets and webui patches
      run: powershell -ExecutionPolicy Bypass -File scripts/smoke-mystremio.ps1
